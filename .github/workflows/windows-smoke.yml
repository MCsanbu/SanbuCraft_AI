name: Windows Smoke Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner
        shell: pwsh
        run: |
          Write-Host "Windows runner is alive."
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion
