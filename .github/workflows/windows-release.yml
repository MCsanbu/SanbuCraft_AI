name: Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install zlib:x64-windows sqlite3:x64-windows

      - name: Install prebuilt Qt
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install aqtinstall
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O "$env:GITHUB_WORKSPACE\Qt"

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 18 2026" -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" -DCMAKE_PREFIX_PATH="$env:GITHUB_WORKSPACE\Qt\6.8.3\msvc2022_64" -DSANBUCRAFT_BUILD_TESTS=ON -DSANBUCRAFT_BUILD_GUI=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Deploy Qt and dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build\Release\sanbucraft_ai.exe dist\sanbucraft_ai.exe
          & "$env:GITHUB_WORKSPACE\Qt\6.8.3\msvc2022_64\bin\windeployqt.exe" --release --compiler-runtime --no-translations dist\sanbucraft_ai.exe
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\zlib1.dll" dist\zlib1.dll -Force
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\sqlite3.dll" dist\sqlite3.dll -Force

      - name: Publish portable runtime to repository
        shell: pwsh
        run: |
          if (Test-Path builds\windows-x64) {
            Remove-Item builds\windows-x64 -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path builds\windows-x64 | Out-Null
          Copy-Item dist\* builds\windows-x64\ -Recurse -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds/windows-x64
          if (-not (git diff --cached --quiet)) {
            git commit -m "chore: publish complete Windows runtime"
            git push
          }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Copy-Item README.md dist\
          Copy-Item LICENSE dist\
          Compress-Archive -Path dist\* -DestinationPath SanbuCraft-AI-Windows-x64.zip -Force

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SanbuCraft-AI-Windows-x64
          path: SanbuCraft-AI-Windows-x64.zip
          if-no-files-found: error
