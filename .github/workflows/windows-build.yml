name: Windows Portable Build

on:
  push:
    branches:
      - main
      - feature/windows-portable-exe
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: update Windows binary')
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure vcpkg
        shell: pwsh
        run: |
          Write-Host "VCPKG_INSTALLATION_ROOT=$env:VCPKG_INSTALLATION_ROOT"
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install qtbase:x64-windows zlib:x64-windows sqlite3:x64-windows

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DSANBUCRAFT_BUILD_TESTS=ON `
            -DSANBUCRAFT_BUILD_GUI=ON

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          $windeploy = Get-ChildItem "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\tools" -Recurse -Filter windeployqt.exe |
            Select-Object -First 1
          if ($null -eq $windeploy) {
            throw "windeployqt.exe was not found in the vcpkg Qt installation."
          }
          New-Item -ItemType Directory -Force -Path dist\data | Out-Null
          Copy-Item build\Release\sanbucraft_ai.exe dist\
          & $windeploy.FullName --release --no-translations dist\sanbucraft_ai.exe

      - name: Copy runtime documentation
        shell: pwsh
        run: |
          Copy-Item README.md dist\
          Copy-Item LICENSE dist\
          @'
SanbuCraft AI - Windows x64

Double-click sanbucraft_ai.exe.

The program opens the Minecraft Java saves directory and lets you select a world folder containing level.dat.

The application reads Minecraft save data in read-only mode.
'@ | Set-Content dist\README_FIRST.txt -Encoding UTF8

      - name: Commit Windows executable bundle
        shell: pwsh
        run: |
          if (git status --porcelain) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            New-Item -ItemType Directory -Force -Path builds\windows-x64 | Out-Null
            Copy-Item dist\* builds\windows-x64\ -Recurse -Force
            git add builds\windows-x64
            git commit -m "chore: update Windows binary"
            git push
          } else {
            Write-Host "No bundle changes to commit."
          }

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath SanbuCraft-AI-Windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SanbuCraft-AI-Windows-x64
          path: SanbuCraft-AI-Windows-x64.zip
          if-no-files-found: error
