name: Windows Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "builds/windows-x64/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\\vcpkg.exe" install qtbase:x64-windows zlib:x64-windows sqlite3:x64-windows

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 18 2026" -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\\scripts\\buildsystems\\vcpkg.cmake" -DSANBUCRAFT_BUILD_TESTS=ON -DSANBUCRAFT_BUILD_GUI=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Locate Qt deployment tool
        id: qt
        shell: pwsh
        run: |
          $tool = Get-ChildItem "$env:VCPKG_INSTALLATION_ROOT\\installed\\x64-windows\\tools" -Recurse -Filter windeployqt.exe | Select-Object -First 1
          if ($null -eq $tool) { throw "windeployqt.exe not found" }
          "path=$($tool.FullName)" >> $env:GITHUB_OUTPUT

      - name: Prepare portable directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build\\Release\\sanbucraft_ai.exe dist\\sanbucraft_ai.exe
          & "${{ steps.qt.outputs.path }}" --release --no-translations dist\\sanbucraft_ai.exe
          Copy-Item README.md dist\\
          Copy-Item LICENSE dist\\
          @'
SanbuCraft AI - Windows x64

Double-click sanbucraft_ai.exe to start.
Select a Minecraft Java world folder containing level.dat.

The application reads the selected Minecraft world in read-only mode.
'@ | Set-Content dist\\README_FIRST.txt -Encoding UTF8

      - name: Publish executable to repository
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path builds\\windows-x64 | Out-Null
          Copy-Item dist\\sanbucraft_ai.exe builds\\windows-x64\\sanbucraft_ai.exe -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds/windows-x64/sanbucraft_ai.exe
          if (-not (git diff --cached --quiet)) {
            git commit -m "chore: update Windows binary"
            git push
          }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist\\* -DestinationPath SanbuCraft-AI-Windows-x64.zip -Force

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: SanbuCraft-AI-Windows-x64
          path: SanbuCraft-AI-Windows-x64.zip
          if-no-files-found: error
